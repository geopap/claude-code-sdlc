# actions/labeler v5 config. Generated by /sdlc:setup from risk globs in .claude/sdlc.json.
# The pr-hygiene workflow adds the matching risk label; risk:standard is the fallback.
"risk:high":
  - changed-files:
      - any-glob-to-any-file:
          - "**/auth/**"
          - "**/middleware.*"
          - "**/billing/**"
          - "**/payments/**"
          - "**/webhooks/**"
          - "supabase/migrations/**"
          - "migrations/**"
          - "**/*.sql"
          - ".github/workflows/**"

"risk:low":
  - changed-files:
      - all-globs-to-all-files:
          - "{**/*.md,docs/**,**/*.test.*,**/*.spec.*,e2e/**}"
