# Cheap deterministic PR gates:
# - Conventional Commit PR title (release notes and versioning depend on it)
# - Risk label from changed paths (labeler.yml), with risk:standard as the fallback
# - Migration guard: PRs that change migrations need a human-applied "db:approved" label
name: pr-hygiene
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  risk-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
      - name: Default to risk:standard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name] | join(",")')"
          case ",$labels," in *",risk:"*) ;; *) gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label risk:standard ;; esac

  migration-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require db:approved for migration changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          # Generated by /sdlc:setup from migrations.paths in .claude/sdlc.json
          MIGRATION_REGEX: '^(supabase/migrations/|migrations/|prisma/migrations/|alembic/versions/)'
        run: |
          files="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files -q '.files[].path')"
          if printf '%s\n' "$files" | grep -qE "$MIGRATION_REGEX"; then
            labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name] | join(",")')"
            case ",$labels," in
              *",db:approved,"*) echo "Migration changes approved by a human." ;;
              *) echo "::error::This PR changes database migrations. A human must review the SQL and its rollback, then add the 'db:approved' label."; exit 1 ;;
            esac
          fi
