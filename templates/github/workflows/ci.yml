# Deterministic gates. /sdlc:setup substitutes your real commands.
# Make "ci / check" a required status check in branch protection.
name: ci
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: "[npm run typecheck]"
      - name: Lint
        run: "[npm run lint]"
      - name: Test
        run: "[npm test]"
      - name: Build
        run: "[npm run build]"
